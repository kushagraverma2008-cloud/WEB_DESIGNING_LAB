<!DOCTYPE html>
<html>
<head>
    <title>ABES Engineering College</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: black;
        }

        nav {
            text-align: center;
            margin: 20px;
        }

        nav a {
            color: blue;
            margin: 0 20px;
            font-size: 18px;
        }

        .college-image {
            text-align: center;
            margin: 20px;
        }

        .college-image img {
            width: 400px;
            height: auto;
        }

        .lists {
            display: flex;
            gap: 100px;
            margin-left: 30px;
        }

        h2 {
            font-size: 22px;
        }
    </style>
</head>

<body>


    <h1>ABES ENGINEERING COLLEGE</h1>

    <hr>


    <nav>
        <a href="#courses">COURSES</a>

    </nav>

    <hr>


    <div class="college-image">
        <img src="college.jpg" alt="ABES Engineering College">
    </div>

    <hr>


    <div class="lists">

        <section id="courses">
            <h2>COURSES</h2>

            <ul type="circle">
                <li>
                    B.TECH
                    <ol>
                        <li>CSE</li>
                        <li>AIML</li>
                        <li>DS</li>
                        <li>ELCE</li>
                        <li>ECE</li>
                    </ol>
                </li>
            </ul>
        </section>

        <section id="management">
            <h2>MANAGEMENT</h2>

            <ol type="A">
                <li>MBA</li>
                <li>MCA</li>
            </ol>
        </section>

    </div>

</body>
</html>
